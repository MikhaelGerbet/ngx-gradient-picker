name: Release Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Pack tarball
        run: |
          cd dist/ngx-gradient-picker
          npm pack

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ngx-gradient-picker/*.tgz
          tag_name: ${{ github.ref_name }}
